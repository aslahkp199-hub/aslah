<!DOCTYPE html>
<html>
    <head>
        <title>Registeration</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>Event Registeration</h1>
        </header>
        <nav>
            <a href="index.html">Home</a>
            <a href="events.html">Events</a>
            <a href="registeration.html">Register</a>
            <a href="contact.html">Contact</a>
        </nav>
        <div class="content">
            <h2>Student Registeration</h2>
            <form onsubmit="registerStudent(event)">
                
                <label>Name:</label>
                <input type="text" id="name" required>
                
                <label>Email</label>
                <input type="email" required>

                <label>Department</label>
                <input type="text" required>

                <label>Select Event</label>
                <select id="event" required>
                    <option value="">Select Event</option>
                    <option>Web Development</option>
                    <option>Quiz Competition</option>
                    <option>Coding Competition</option>
                </select>
                <button type="submit">Register</button>
            </form>
            <p id="message"></p>
        </div>
        <script>
            function registerStudent(event){
                event.preventDefault();
                let name=document.getElementById("name").value;
                let eventName=document.getElementById("event").value;
                document.getElementById("message").innerHTML=
                "Successfully Registered!<br>"+"Welcome "+name+"<br>"+"Event:"+eventName;
                document.getElementById("message").style.display="block";
            }
        </script>
    </body>
</html>
